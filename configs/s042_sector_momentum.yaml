data_dir: data/cache/etf_tr
data_suffix: _1Day_tr.parquet
symbols: XLB,XLC,XLE,XLF,XLI,XLK,XLP,XLRE,XLU,XLV,XLY   # 11 SPDR sectors (PIT via history rule; SPY/SHY added for benchmarks)
min_history: 252
signal: mom12           # mom12 (12-month TR) | rankavg (1/3/6/9/12 avg rank) | blend13 (1M+3M, ex-S048 Validea)
breadth: 3
rebalance: monthly      # monthly | weekly
delisting_return: -0.30
cost_bps_per_side: 5.0
fills: close,next_open  # rule names the month-end close; next_open is the robustness fill
partition_split_date: "2024-01-01"
n_draws: 1000
n_boot: 5000
seed: 20261101
book_slots: 3

variants:
  rankavg: {signal: rankavg}
  validea: {signal: blend13, breadth: 5, book_slots: 5}   # ex-S048: 1M+3M blend, top 5, monthly
  top5: {breadth: 5, book_slots: 5}
  weekly: {rebalance: weekly}
